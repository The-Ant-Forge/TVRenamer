[versions]
# Tooling / plugins
shadow = "9.6.1"
launch4j = "4.0.0"
spotbugs = "6.5.11"

# Runtime dependencies
swt = "3.135.0"
gson = "2.14.0"

# Test dependencies
junit = "6.1.3"

[libraries]
swtWin64 = { module = "org.eclipse.platform:org.eclipse.swt.win32.win32.x86_64", version.ref = "swt" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
launch4j = { id = "edu.sc.seis.launch4j", version.ref = "launch4j" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
